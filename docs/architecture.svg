<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Military SLICES architecture</title>
  <desc id="desc">Typed input is reviewed before a governed transition. Deliberately selected artifacts authorize one bounded evidence update without manufacturing a human objective. A deterministic service-aware path joins the human objective to the next milestone. Firestore persists canonical and historical state. Lenses observe, History inspects, and What-If creates an ephemeral branch. Only explicit human promotion can create a new canonical version.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#132d46"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#f2c45e"/></marker>
    <style>
      .box{fill:#1e3a53;stroke:#7198b8;stroke-width:2;rx:20;filter:url(#shadow)}
      .core{fill:#274c67;stroke:#f2c45e;stroke-width:3;rx:20;filter:url(#shadow)}
      .control{fill:#142f45;stroke:#65d5c5;stroke-width:2;rx:18;filter:url(#shadow)}
      .label{fill:#f7f3e8;font:700 24px system-ui,sans-serif;text-anchor:middle}
      .small{fill:#cfdae4;font:18px system-ui,sans-serif;text-anchor:middle}
      .eyebrow{fill:#f2c45e;font:700 16px system-ui,sans-serif;letter-spacing:2px;text-anchor:middle}
      .line{stroke:#f2c45e;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .observe{stroke:#65d5c5;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .promote{stroke:#f2c45e;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="900" rx="32" fill="url(#bg)"/>
  <text x="700" y="62" class="label" font-size="34">Military SLICES</text>
  <text x="700" y="94" class="small">One canonical transition plan · one next useful interaction</text>

  <rect class="box" x="60" y="170" width="250" height="150"/>
  <text class="eyebrow" x="185" y="210">HUMAN INPUT</text>
  <text class="label" x="185" y="250">Sentence or artifact</text>
  <text class="small" x="185" y="282">PDF · DOCX · TXT</text>
  <text class="small" x="185" y="308">PNG · JPG</text>

  <rect class="box" x="400" y="170" width="250" height="150"/>
  <text class="eyebrow" x="525" y="210">TRUST BOUNDARY</text>
  <text class="label" x="525" y="246">Bounded authority</text>
  <text class="small" x="525" y="280">Typed: review + confirm</text>
  <text class="small" x="525" y="308">Artifact: direct bounded update</text>

  <rect class="core" x="740" y="140" width="300" height="210"/>
  <text class="eyebrow" x="890" y="185">BOUNDED PATH RUNTIME</text>
  <text class="label" x="890" y="225">Objective + milestone</text>
  <text class="small" x="890" y="260">Service + time window</text>
  <text class="small" x="890" y="289">ADK + Gemini only when</text>
  <text class="small" x="890" y="318">the career gate authorizes it</text>

  <rect class="box" x="1130" y="170" width="210" height="150"/>
  <text class="eyebrow" x="1235" y="210">FIRESTORE</text>
  <text class="label" x="1235" y="250">Canonical state</text>
  <text class="small" x="1235" y="282">Versioned · idempotent</text>
  <text class="small" x="1235" y="308">Evidence + decisions</text>

  <path class="line" d="M310 245H385"/><path class="line" d="M650 245H725"/><path class="line" d="M1040 245H1115"/>

  <rect class="core" x="410" y="430" width="580" height="150"/>
  <text class="eyebrow" x="700" y="472">ADAPTIVE INTERFACE ON CLOUD RUN</text>
  <text class="label" x="700" y="515">What matters now</text>
  <text class="small" x="700" y="549">One gate + one to three tasks → human decision → recompute</text>
  <path class="line" d="M1235 320V385H990V420"/>
  <path class="line" d="M410 505H185V335"/>

  <rect class="control" x="175" y="670" width="270" height="115"/>
  <text class="eyebrow" x="310" y="708">LENSES</text>
  <text class="label" x="310" y="744">Observe current state</text>
  <text class="small" x="310" y="772">No activation · no model call</text>

  <rect class="control" x="565" y="670" width="270" height="115"/>
  <text class="eyebrow" x="700" y="708">HISTORY</text>
  <text class="label" x="700" y="744">Inspect prior state</text>
  <text class="small" x="700" y="772">Read-only canonical versions</text>

  <rect class="control" x="955" y="670" width="270" height="115"/>
  <text class="eyebrow" x="1090" y="708">WHAT-IF</text>
  <text class="label" x="1090" y="744">Hypothetical branch</text>
  <text class="small" x="1090" y="772">Explore ≠ commit</text>

  <path class="observe" d="M560 580V625H310V660"/>
  <path class="observe" d="M700 580V660"/>
  <path class="observe" d="M840 580V625H1090V660"/>
  <path class="promote" d="M1225 727H1305V350H1250"/>
  <text class="small" x="1287" y="535" transform="rotate(-90 1287 535)">explicit human promotion only</text>

  <text x="700" y="858" class="small">Observe ≠ activate · Explore ≠ commit · Only governed promotion changes canonical truth.</text>
</svg>
