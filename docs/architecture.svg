<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
  <title id="title">Military SLICES architecture</title>
  <desc id="desc">One governed transition loop persists decisions, deterministically revalidates affected assumptions, and derives ACTIVE, PARALYZED, or COMPLETE before presenting the next interaction. Lenses observe, History inspects, and What-If stays hypothetical until explicit promotion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#132d46"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".24"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#f2c45e"/></marker>
    <style>
      .box{fill:#1e3a53;stroke:#7198b8;stroke-width:2;rx:20;filter:url(#shadow)}
      .core{fill:#274c67;stroke:#f2c45e;stroke-width:3;rx:20;filter:url(#shadow)}
      .control{fill:#142f45;stroke:#65d5c5;stroke-width:2;rx:18;filter:url(#shadow)}
      .label{fill:#f7f3e8;font:700 24px system-ui,sans-serif;text-anchor:middle}
      .small{fill:#cfdae4;font:18px system-ui,sans-serif;text-anchor:middle}
      .eyebrow{fill:#f2c45e;font:700 16px system-ui,sans-serif;letter-spacing:2px;text-anchor:middle}
      .line{stroke:#f2c45e;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .observe{stroke:#65d5c5;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .promote{stroke:#f2c45e;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="1050" rx="32" fill="url(#bg)"/>
  <text x="700" y="62" class="label" font-size="34">Military SLICES</text>
  <text x="700" y="94" class="small">One canonical transition plan · one next useful interaction</text>

  <rect class="box" x="60" y="170" width="250" height="150"/>
  <text class="eyebrow" x="185" y="210">HUMAN INPUT</text>
  <text class="label" x="185" y="250">Sentence or artifact</text>
  <text class="small" x="185" y="282">PDF · DOCX · TXT</text>
  <text class="small" x="185" y="308">PNG · JPG</text>

  <rect class="box" x="400" y="170" width="250" height="150"/>
  <text class="eyebrow" x="525" y="210">TRUST BOUNDARY</text>
  <text class="label" x="525" y="246">Bounded authority</text>
  <text class="small" x="525" y="280">Typed: review + confirm</text>
  <text class="small" x="525" y="308">Artifact: direct bounded update</text>

  <rect class="core" x="740" y="140" width="300" height="210"/>
  <text class="eyebrow" x="890" y="185">BOUNDED PATH RUNTIME</text>
  <text class="label" x="890" y="225">Objective + milestone</text>
  <text class="small" x="890" y="260">Service + time window</text>
  <text class="small" x="890" y="289">ADK + Gemini only when</text>
  <text class="small" x="890" y="318">the active gate authorizes it</text>

  <rect class="box" x="1130" y="170" width="210" height="150"/>
  <text class="eyebrow" x="1235" y="210">FIRESTORE</text>
  <text class="label" x="1235" y="250">Canonical state</text>
  <text class="small" x="1235" y="282">Versioned · idempotent</text>
  <text class="small" x="1235" y="308">Evidence + decisions</text>

  <path class="line" d="M310 245H385"/><path class="line" d="M650 245H725"/><path class="line" d="M1040 245H1115"/>

  <rect class="control" x="250" y="400" width="900" height="135"/>
  <text class="eyebrow" x="700" y="438">TEMPORAL REVALIDATION IN THE SAME LOOP</text>
  <text class="label" x="700" y="474">Governed delta → static dependencies → materiality</text>
  <text class="small" x="700" y="506">Machine refresh or one-tap human check → small receipt patch · zero Gemini detection calls</text>
  <path class="line" d="M1235 320V365H700V390"/>

  <rect class="core" x="330" y="585" width="360" height="150"/>
  <text class="eyebrow" x="510" y="627">DERIVED EXECUTION STATE</text>
  <text class="label" x="510" y="670">ACTIVE · PARALYZED · COMPLETE</text>
  <text class="small" x="510" y="704">Named blocker · version · authority</text>
  <rect class="core" x="750" y="585" width="420" height="150"/>
  <text class="eyebrow" x="960" y="627">ADAPTIVE INTERFACE ON CLOUD RUN</text>
  <text class="label" x="960" y="670">What matters now</text>
  <text class="small" x="960" y="704">One gate + up to three tasks</text>
  <path class="line" d="M700 535V560H510V575"/>
  <path class="line" d="M690 660H740"/>
  <path class="line" d="M750 700H185V335"/>

  <rect class="control" x="175" y="825" width="270" height="115"/>
  <text class="eyebrow" x="310" y="863">LENSES</text>
  <text class="label" x="310" y="899">Observe current state</text>
  <text class="small" x="310" y="927">No activation · no model call</text>

  <rect class="control" x="565" y="825" width="270" height="115"/>
  <text class="eyebrow" x="700" y="863">HISTORY</text>
  <text class="label" x="700" y="899">Inspect prior state</text>
  <text class="small" x="700" y="927">Read-only canonical versions</text>

  <rect class="control" x="955" y="825" width="270" height="115"/>
  <text class="eyebrow" x="1090" y="863">WHAT-IF</text>
  <text class="label" x="1090" y="899">Hypothetical branch</text>
  <text class="small" x="1090" y="927">Explore ≠ commit</text>

  <path class="observe" d="M860 735V780H310V815"/>
  <path class="observe" d="M960 735V780H700V815"/>
  <path class="observe" d="M1060 735V780H1090V815"/>
  <path class="promote" d="M1225 882H1305V350H1250"/>
  <text class="small" x="1287" y="615" transform="rotate(-90 1287 615)">explicit human promotion only</text>

  <text x="700" y="1008" class="small">Persist decisions · Revalidate assumptions · Unchanged state stays latent.</text>
</svg>
